services:
  db:
    image: postgres:17-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-hospeda}
      - POSTGRES_USER=${POSTGRES_USER:-hospeda}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hospeda}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospeda} -d ${POSTGRES_DB:-hospeda}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=1
      - DJANGO_ALLOWED_HOSTS=admin.hospeda,localhost,127.0.0.1,backend
      - POSTGRES_DB=${POSTGRES_DB:-hospeda}
      - POSTGRES_USER=${POSTGRES_USER:-hospeda}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hospeda}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "80:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
      - VITE_ALLOWED_HOSTS=admin.hospeda
      - VITE_HMR_CLIENT_PORT=80
    depends_on:
      - backend

volumes:
  pgdata:
